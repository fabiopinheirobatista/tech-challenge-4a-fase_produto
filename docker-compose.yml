version: '3.8'

services:
  produto-db:
    image: mysql:8.0
    container_name: produto-db-dev
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: produto_db
    ports:
      - "33062:3306"
    volumes:
      - produto_dev_data:/var/lib/mysql
    networks:
      - produto-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  produto-api:
    build: .
    container_name: produto-api-dev
    depends_on:
      produto-db:
        condition: service_healthy
    ports:
      - "8082:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://produto-db:3306/produto_db?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    networks:
      - produto-net

volumes:
  produto_dev_data:

networks:
  produto-net: